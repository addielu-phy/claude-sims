<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude 版互動物理模擬｜總目錄</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%227%22 fill=%22%2323497a%22/%3E%3C/svg%3E">
<style>
:root{--bg:#f5f2ea;--card:#fffdf8;--ink:#1d2632;--muted:#5b6674;--line:#e2dccd;--accent:#23497a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.7}
.wrap{max-width:980px;margin:0 auto;padding:28px 18px 40px}
.badge{display:inline-flex;align-items:center;gap:6px;background:#1d2632;color:#fff;border-radius:999px;padding:3px 12px;font-size:13px;letter-spacing:.06em;font-weight:600}
.badge i{width:8px;height:8px;border-radius:50%;background:#e8a33b;display:inline-block}
h1{font-size:clamp(24px,3.6vw,34px);margin:12px 0 4px}
p.sub{color:var(--muted);margin:0 0 22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
a.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;text-decoration:none;color:inherit;transition:border-color .15s,box-shadow .15s}
a.card:hover{border-color:#c7bda6;box-shadow:0 3px 12px rgba(0,0,0,.06)}
.card .tag{font-size:12.5px;color:var(--accent);font-weight:700;letter-spacing:.04em}
.card h2{font-size:19px;margin:4px 0 6px}
.card p{margin:0;color:var(--muted);font-size:14.5px}
.card svg{display:block;margin:0 0 10px}
footer{color:var(--muted);font-size:13px;margin-top:28px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <span class="badge"><i></i>Claude 版</span>
  <h1>互動物理模擬總目錄</h1>
  <p class="sub">由 Claude 製作的高中物理互動教材。每個模擬都附完整解說與數值稽核。</p>
  <div class="grid">
    <a class="card" href="box-slide-or-tip/">
      <svg width="100%" height="96" viewBox="0 0 280 96" aria-hidden="true">
        <rect x="0" y="82" width="280" height="14" fill="#d8d2c3"/><line x1="0" y1="82" x2="280" y2="82" stroke="#7d7566" stroke-width="2"/>
        <rect x="112" y="10" width="36" height="72" fill="#e9c98f" stroke="#8a5a2b" stroke-width="2"/>
        <line x1="190" y1="52" x2="152" y2="52" stroke="#cf3b35" stroke-width="3"/><path d="M148 52 l9 -5 v10 z" fill="#cf3b35"/>
        <circle cx="112" cy="82" r="4" fill="none" stroke="#1d2632" stroke-width="1.5"/>
        <text x="196" y="56" font-size="13" fill="#cf3b35" font-weight="700">F</text>
      </svg>
      <div class="tag">範例 11｜摩擦力・力矩</div>
      <h2>推木箱：先滑動，還是先傾倒？</h2>
      <p>正向力作用點怎麼隨推力移動？F–h 判斷圖、三小題逐步計算。</p>
    </a>
    <a class="card" href="torque-lever/">
      <svg width="100%" height="96" viewBox="0 0 280 96" aria-hidden="true">
        <rect x="0" y="86" width="280" height="10" fill="#d8d2c3"/>
        <path d="M140 50 L124 86 H156 Z" fill="#5b6674"/>
        <rect x="30" y="42" width="220" height="10" rx="3" fill="#f3e3bd" stroke="#8a5a2b" stroke-width="1.5"/>
        <line x1="63" y1="52" x2="63" y2="60" stroke="#1d2632"/><rect x="52" y="60" width="22" height="18" rx="3" fill="#7d8794"/>
        <line x1="226" y1="10" x2="226" y2="32" stroke="#cf3b35" stroke-width="3"/><path d="M226 41 l-5 -9 h10 z" fill="#cf3b35"/>
        <text x="232" y="22" font-size="13" fill="#cf3b35" font-weight="700">F</text>
      </svg>
      <div class="tag">國中 2-5｜力矩・槓桿原理</div>
      <h2>力矩與槓桿原理：互動解說</h2>
      <p>力臂偵測器、米尺掛砝碼、三種槓桿分類器，七個情境例題逐步計算。</p>
    </a>
  </div>
  <footer>原始碼：<a href="https://github.com/addielu-phy/claude-sims">github.com/addielu-phy/claude-sims</a>｜MIT License</footer>
</div>
</body>
</html>
